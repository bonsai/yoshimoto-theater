name: Live Recovery

on:
  workflow_run:
    workflows: ['Live Check']
    types:
      - completed

permissions:
  contents: write
  issues: write

concurrency:
  group: live-recovery
  cancel-in-progress: false

jobs:
  auto-recover:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - name: Checkout failed run commit
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.workflow_run.repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Reproduce build failure and capture log
        id: reproduce
        run: |
          set +e
          python scripts/build_live.py > error.log 2>&1
          rc=$?
          echo "build_exit=$rc" >> "$GITHUB_OUTPUT"
          echo "== reproduction log (exit=$rc) =="
          cat error.log

      - name: Rollback config/live.yml to last known good and rebuild
        id: rollback
        if: steps.reproduce.outputs.build_exit != '0'
        run: |
          PREV=$(git log --format='%H' -n2 -- config/live.yml | tail -n1)
          if [ -n "$PREV" ]; then
            git show "$PREV:config/live.yml" > config/live.yml
            python scripts/build_live.py
            SHORT=$(echo "$PREV" | cut -c1-7)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add config/live.yml data/tokyo-live.json docs/tokyo-theaters.html
            if ! git diff --cached --quiet; then
              git commit -m "recovery: rollback live.yml to $SHORT (live-check failed)"
              git push
              echo "rolled_back=yes" >> "$GITHUB_OUTPUT"
              echo "rollback_sha=$SHORT" >> "$GITHUB_OUTPUT"
            else
              echo "rolled_back=noop" >> "$GITHUB_OUTPUT"
              echo "rollback_sha=$SHORT" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "rolled_back=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update auto-recovery issue
        if: steps.reproduce.outputs.build_exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SHA_SHORT: ${{ github.event.workflow_run.head_sha }}
        run: |
          LOG_EXCERPT=$(tail -c 2000 error.log)
          RB="${{ steps.rollback.outputs.rolled_back }}"
          RB_SHORT="${{ steps.rollback.outputs.rollback_sha }}"
          BODY=$(printf '### Live Check failure detected\n\n- Run: %s\n- Run ID: %s\n- Commit: %s\n- Exit: %s\n\n```text\n%s\n```\n\n### Auto-recovery action\n- Config rollback: %s\n- Rollback commit: %s' \
            "$RUN_URL" "$RUN_ID" "$SHA_SHORT" "${{ steps.reproduce.outputs.build_exit }}" "$LOG_EXCERPT" "$RB" "${RB_SHORT:-none}")
          TITLE="[auto-recovery] Live Check failed ($SHA_SHORT)"
          EXISTING=$(gh issue list --label auto-recovery --state open --json number --limit 10 --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label auto-recovery --body "$BODY"
          fi