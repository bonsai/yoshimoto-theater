name: Live Check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

jobs:
  build-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Build JSON and HTML (auto-retry with backoff)
        run: |
          for attempt in 1 2 3; do
            echo "== build attempt $attempt =="
            if python scripts/build_live.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Commit generated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/live.yml data/tokyo-live.json docs/tokyo-theaters.html
          git diff --cached --quiet || git commit -m 'chore: update Tokyo live data'
          git push
